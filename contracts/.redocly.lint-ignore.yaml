# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
#
# استثناءات مقصودة ومراجعة يدوياً:
# - operation-2xx-response: عمليات استهلاك روابط البريد ترجع 303 إلى مسار محلي حسب الفصل 09، لا 2xx.
# - operation-4xx-response: قراءات عامة بلا مدخلات (المراجع والسياسات وhealthz) لا يوجد لها خطأ 4xx.
# أي استثناء جديد يُضاف هنا يحتاج سبباً مكتوباً.
paths/auth.yaml:
  operation-2xx-response:
    - '#/confirm/post/responses'
    - '#/recoveryVerify/post/responses'
paths/account.yaml:
  operation-2xx-response:
    - '#/emailChangeConfirm/post/responses'
    - '#/deletionRecoveryConfirm/post/responses'
  operation-4xx-response:
    - '#/policies/get/responses'
paths/market.yaml:
  operation-4xx-response:
    - '#/catalog/get/responses'
paths/ops.yaml:
  operation-4xx-response:
    - '#/healthz/get/responses'
