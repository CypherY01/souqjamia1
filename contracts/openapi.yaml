components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: >-
        كوكيز جلسة Supabase تديرها مكتبة @supabase/ssr من الخادم. الاسم الفعلي
        sb-<project-ref>-auth-token وقد يُقسَّم لعدة كوكيز. رمز الوصول صالح عشر دقائق (DEC38).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        مطلوب لكل طلب يغيّر الحالة، مع فحص Origin وFetch Metadata (SEC05). يُطلب من API013.
    probeToken:
      type: apiKey
      in: header
      name: X-Probe-Token
      description: سر فحص الجاهزية الداخلي، من إعدادات بيئة التشغيل.
