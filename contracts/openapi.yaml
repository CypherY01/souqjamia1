openapi: 3.1.0

info:
  title: سوق الجامعة — واجهة المرحلة الأولى
  version: 0.5.10-phase1
  summary: عقد REST للمرحلة الأولى حسب docs/addendum-v3.1.md وdocs/spec-v3-en.md.
  description: >-
    معتمد من المالك في 18 نوفمبر 2026، مع القرارات حتى DEC66 وإضافات المهمة 1.6، وDEC69 وDEC74 وإضافات المهمة 3.2 (الإصدار 0.5.1)، وDEC76 وإضافات المهمة 3.3 (الإصدار 0.5.2)، وإضافات المهمة 3.4 (الإصدار 0.5.3)، وDEC78 وإضافات المهمة 3.5 (الإصدار 0.5.4)، وDEC79 وإضافات المهمة 3.6 (الإصدار 0.5.5)، وDEC81 وإضافات المهمة 3.7 (الإصدار 0.5.6)، وإضافات المهمة 4.2 (الإصدار 0.5.7)، وDEC84 وإضافات المهمة 4.3 (الإصدار 0.5.8)، وDEC85 وإضافات المهمة 4.4 (الإصدار 0.5.9). تغطي 98 عملية للمرحلة الأولى.
    العمليات المستبعدة وأسبابها في x-phase1-excluded أدناه. الاتفاقات المشتركة، ومستويات الوصول،
    ورموز الأخطاء في contracts/README.md. عقد التحديث الفوري في contracts/realtime.md.
    الامتدادات x-spec-ids وx-access وx-rate-limit وx-open-question وx-phase1-excluded موثقة في README.

servers:
