  post:
    operationId: api005ResendLink
    tags: [auth]
    summary: إعادة إرسال رابط التأكيد
    description: >-
      رد عام بلا كشف للحساب. مهلة 60 ثانية بين الإرسالين (RL03، DEC37).
      تعمل فقط حين يكون التأكيد مفعّلاً، وإلا ترجع 404 NOT_FOUND (DEC63، DEC66).
      حدود RL03 لكل بريد (واحد في الدقيقة، و3 في الساعة، و10 في اليوم) تُعدّ قبل الاستدعاء، وتنطبق
      على أي بريد مسجّلاً كان أو لا. مهلة Supabase لحساب موجود تصل كالرد العام 202.
      purpose=email_change يرجع 404 حتى المهمة 3.6. البريد بصيغة خاطئة 422 للحقل email.
    x-spec-ids: [API005, FR57, DEC37, DEC63, DEC66, TC26]
    x-access: guest
    x-rate-limit: [RL03, supabase_auth, turnstile]
