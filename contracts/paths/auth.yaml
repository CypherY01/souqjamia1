# الهوية والجلسات. كل التدفقات تمر عبر خادم Next.js الذي يستدعي Supabase Auth من الخادم (DEC35، DEC36).
# عداداتنا RL01 وRL03 وRL14 طبقة إضافية على هذا المسار. الاستدعاء المباشر لـ Supabase Auth يحميه Turnstile وحدوده المدمجة.

signup:
  post:
    operationId: api001Signup
    tags: [auth]
    summary: إنشاء حساب
    description: >-
      يسجل الإقرار بنسختي الشروط والخصوصية الحاليتين (API114).
      التأكيد معطّل الآن (DEC63): ينشئ الحساب ويفتح جلسة فوراً، ويرد 200 مثل الدخول.
      إذا فُعّل التأكيد بالإعداد email_confirmation_required: يرسل رابطاً صالحاً ساعة (DEC37)،
      ويرد 202 نفسه حتى لو كان البريد مستخدماً، بلا كشف للحساب (TC01).
      والتأكيد معطّل، البريد المستخدم يرد 422 VALIDATION_FAILED مع خطأ الحقل email بالرمز
      email_registered ورسالة «هذا البريد مسجّل. سجّل الدخول أو استعد كلمة المرور»،
      بلا حساب ولا جلسة (DEC64).
      كل أخطاء الحقول معاً في رد 422 واحد (TC01)، برموز الحقول: name (required، too_small، too_big،
      invalid_format)، email (required، too_big، invalid_format، email_registered)، password
      (too_short، too_long، too_many_bytes، وweak لكلمة مرور ضعيفة أو مسرّبة، DEC32)،
      terms_version وprivacy_version (not_current: تغيّرت النسخ، فتجلب الواجهة API114 من جديد)،
      college_id (unknown: كلية غير موجودة أو معطّلة)، accept_terms وacknowledge_privacy (required).
      العضو بجلسة حية يرد 403 FORBIDDEN. حد RL02 عندنا قبل استدعاء Supabase (DEC74): 5 محاولات
      في الساعة لكل زائر، و300 لكل عنوان قابلة للضبط، وتُعدّ المحاولة ولو فشلت. ومع التفعيل
      يُعدّ التسجيل من RL03 لهذا البريد.
    x-spec-ids: [API001, FR01, FR57, DEC26, DEC32, DEC36, DEC37, DEC63, DEC64, DEC74, BR24, TC01, TC25, TC26]
    x-access: guest
    x-rate-limit: [RL02, supabase_auth, turnstile]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/SignupInput'
    responses:
      '200':
        $ref: '../components/responses.yaml#/LoginOk'
      '202':
        $ref: '../components/responses.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

login:
  post:
    operationId: api002Login
    tags: [auth]
    summary: الدخول بالبريد وكلمة المرور
    description: >-
      ينشئ جلسة في كوكيز يديرها الخادم ويرجع مساراً محلياً مسموحاً فقط (TC02).
      الحساب المقيّد أو بانتظار الحذف يُوجَّه لتدفقه المحدود (FR78): الحالة restricted أو
      deletion_pending، وnext هو /restricted. أصحاب الأدوار الإدارية يكملون بـ API011 (المهمة 7.1).
      كلمة مرور خاطئة وبريد غير مسجّل يأخذان نفس الرد 401 UNAUTHENTICATED، بلا كشف للحساب.
      كل أخطاء الحقول معاً في رد 422 قبل استدعاء Supabase، فلا جلسة: email (required،
      too_big، invalid_format)، password (required)، next (not_local: ليس مساراً محلياً مسموحاً).
      حد RL01 عندنا: 5 محاولات فاشلة في 15 دقيقة لكل بريد، و200 لكل عنوان، بنوافذ ثابتة.
      الطلب أثناء الحد يرد 429 مع Retry-After بلا فحص كلمة المرور. CAPTCHA_FAILED يرد 403 ولا
      يُعدّ. البريد غير المؤكد (حين يُفعَّل التأكيد) يرد 403 EMAIL_NOT_CONFIRMED بعد كلمة مرور
      صحيحة فقط. العضو بجلسة عادية حية يرد 403 FORBIDDEN، وجلسة الاستعادة تُنهى ثم يكمل الدخول.
      النجاح يجدد ربط رمز CSRF بكوكي زائر جديد (المهمة 1.6).
    x-spec-ids: [API002, FR02, FR78, BR21, RL01, DEC38, DEC52, DEC70, DEC73, TC02, TC28]
    x-access: guest
    x-rate-limit: [RL01, supabase_auth, turnstile]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LoginInput'
    responses:
      '200':
        $ref: '../components/responses.yaml#/LoginOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

logout:
  post:
    operationId: api003Logout
    tags: [auth]
    summary: الخروج
    description: >-
      يلغي هذه الجلسة فقط عند Supabase Auth (scope local)، ويحذف كل كوكيز الجلسة، ويجدد ربط
      رمز CSRF بكوكي زائر جديد، والعميل يغلق قنوات Realtime الخاصة (FR49، TC56). أي جلسة
      موثّقة تخرج، ومنها جلسة الاستعادة المحدودة (DEC73). الخروج ينجح على الجهاز دائماً
      (DEC76): يرد 204 ويحذف الكوكيز حتى حين لا يرد Supabase أو يفشل الإلغاء، ويُسجَّل الفشل
      بلا رموز. بلا جلسة أصلاً يرد 401، مع حذف الكوكيز وتجديد الربط أيضاً.
    x-spec-ids: [API003, FR49, DEC73, DEC76, TC56]
    x-access: session
    security:
      - sessionCookie: []
        csrfToken: []
    responses:
      '204':
        $ref: '../components/responses.yaml#/NoContent'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

confirm:
  post:
    operationId: api004ConfirmSignup
    tags: [auth]
    summary: تأكيد البريد من صفحة الرابط
    description: >-
      صفحة الرابط بطلب GET تعرض زراً فقط، وهذا الطلب POST هو الذي يستهلك الرابط مرة واحدة،
      حماية من ماسحات البريد (القسم 5). لا تُنشأ جلسة سوق: الجلسة التي يفتحها Supabase
      عند قبول الرابط تُلغى فوراً، ولا كوكي. والتوجيه إلى /login?confirmed=1.
      تعمل فقط حين يكون التأكيد مفعّلاً، وإلا ترجع 404 NOT_FOUND (DEC63، DEC66).
    x-spec-ids: [API004, FR57, BR21, DEC37, DEC63, DEC66, TC26]
    x-access: guest
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TokenInput'
    responses:
      '303':
        $ref: '../components/responses.yaml#/LinkRedirect'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

