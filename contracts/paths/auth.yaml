reset:
  post:
    operationId: api008ResetPassword
    tags: [auth]
    summary: تعيين كلمة مرور جديدة من جلسة الاستعادة
    description: >-
      يغيّر كلمة المرور ويلغي كل جلسات الحساب، ومنها جلسة الاستعادة نفسها (FR03، TC27)، ويحذف كوكيز
      الجلسة ويجدد ربط الزائر. ثم يدخل العضو بكلمة المرور الجديدة. يُسجَّل account.password_reset في
      التدقيق، ويرسل Supabase Auth بريد الإشعار (SEC11). الزائر وجلسة الاستعادة بعد خمس دقائق 401،
      والجلسة العادية 403 FORBIDDEN (تغيير كلمة المرور من الحساب في 3.6). أي حالة حساب تعيّن كلمة
      المرور، والدخول بعدها يوجّه المقيّد إلى /restricted. رموز الحقل new_password: too_short
      وtoo_long وtoo_many_bytes (DEC32)، وsame_password لنفس كلمة المرور، وweak لما يرفضه فحص
      Supabase.
    x-spec-ids: [API008, FR03, FR59, DEC32, DEC38, DEC73, SEC11, TC03, TC27]
    x-access: recovery
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
