recovery:
  post:
    operationId: api006RequestRecovery
    tags: [auth]
    summary: طلب رابط استعادة كلمة المرور
    description: >-
      رد عام بلا كشف للحساب. الرابط صالح ساعة ويُستهلك مرة (DEC37)، وآخر رابط مطلوب وحده صالح.
      الجلسة لا تُقرأ: أي زائر أو عضو يطلب رابطاً. حدود RL03 لكل بريد (واحد في الدقيقة، و3 في الساعة،
      و10 في اليوم) تُعدّ قبل الاستدعاء، لأي بريد مسجّلاً كان أو لا، وهي نفس عدّادات API005.
      البريد غير المسجّل، ومهلة Supabase لحساب موجود، يصلان كالرد العام 202.
      البريد بصيغة خاطئة 422 للحقل email برمز required أو too_big أو invalid_format.
    x-spec-ids: [API006, FR03, BR21, DEC37, DEC52, RL03, TC03]
    x-access: guest
    x-rate-limit: [RL03, supabase_auth, turnstile]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/EmailCaptchaInput'
    responses:
      '202':
        $ref: '../components/responses.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

recoveryVerify:
  post:
    operationId: api007VerifyRecovery
    tags: [auth]
    summary: استهلاك رابط الاستعادة
    description: >-
      صفحة الرابط بطلب GET تعرض زراً فقط، وهذا الطلب POST هو الذي يستهلك الرابط مرة واحدة.
      ينشئ جلسة استعادة صالحة خمس دقائق لتغيير كلمة المرور فقط، بلا وصول للسوق أو المحادثات.
      الخادم يفرض ذلك من مطالبة amr (otp فقط، DEC73) وتوقيتها (DEC38). النجاح 303 إلى /account/reset
      مع كوكيز الجلسة وربط زائر جديد. جلسة عادية حية في المتصفح 403 FORBIDDEN بلا استهلاك للرابط،
      والصفحة تعرض قبلها زر «اخرج وأكمل الاستعادة». جلسة استعادة سابقة تُنهى أولاً.
      الرابط المستعمل أو المنتهي أو الأقدم من رابط أحدث 422 LINK_INVALID_OR_EXPIRED.
      حين يكون التأكيد مفعّلاً، فتح الرابط يؤكد البريد أيضاً (يثبت ملكيته).
    x-spec-ids: [API007, FR03, FR59, BR21, DEC37, DEC38, DEC73, TC03]
    x-access: guest
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TokenInput'
    responses:
