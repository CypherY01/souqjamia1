# المراجع والإعلانات والمفضلة.

catalog:
  get:
    operationId: api030GetCatalog
    tags: [catalog]
    summary: الفئات والكليات ونقاط اللقاء النشطة
    description: >-
      نقاط اللقاء اقتراحات لأماكن عامة داخل الجامعة وفي المدينة (DEC28)، والقائمة قد تكون فارغة
      حتى يضيفها المالك (G02)، فيبقى «حسب الاتفاق» وحده. الصفوف النشطة فقط، بترتيب العرض. الرد
      يحمل Cache-Control: public, max-age=300 (المهمة 4.2)، والنشر يعيد فحص المرجع على أي حال.
    x-spec-ids: [API030, FR08, FR20, FR55, BR03, DEC28]
    x-access: public
    security: []
    responses:
      '200':
        $ref: '../components/responses.yaml#/CatalogOk'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

listings:
  get:
    operationId: api031SearchListings
    tags: [listings]
    summary: البحث في الإعلانات العامة
    description: >-
      الفلاتر تتقاطع (FR09). يظهر النشط فقط: تُستبعد الإعلانات المباعة (DEC84) والمخفية والمؤرشفة
      وإعلانات الحسابات المقيّدة أو بانتظار الحذف. البحث على search_text المطبّع (القسم 6.3، DEC67)
      بمجموعتين (DEC84): exact حين تكون كل كلمة جزءاً من نسخة البحث أو العبارة بلا مسافات جزءاً منها
      بلا مسافات، ثم close بتشابه pg_trgm (word_similarity) لا يقل عن 0.5. الترتيب: exact قبل close،
      ثم sort داخل كل منهما، ثم المعرّف (FR11). ومع q تحمل كل بطاقة match.
      رموز 400: q بالرمز too_big (أكثر من 100 محرف بعد التطبيع، أو 400 قبله)، وcategory وcondition
      وsort بالرمز invalid_value، وlocation بالرمز invalid_format أو unavailable (نقطة غير نشطة)،
      وlimit بالرمز invalid_type أو out_of_range، وINVALID_CURSOR لمؤشر مزوّر أو لفلاتر تغيّرت.
      RL04: 120 في الدقيقة للجلسة (معرّف العضو أو كوكي الزائر، DEC84) و1200 للعنوان، ثم 429 مع
      Retry-After. الرد Cache-Control: no-store.
    x-spec-ids: [API031, FR06, FR07, FR08, FR09, FR10, FR11, FR12, NFR14, RL04, DEC84, TC04, TC29, TC81]
    x-access: public
    x-rate-limit: [RL04]
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/Query'
      - name: category
        in: query
        required: false
        schema:
          $ref: '../components/schemas.yaml#/CategoryKey'
      - name: condition
        in: query
        required: false
        schema:
          $ref: '../components/schemas.yaml#/Condition'
      - name: location
        in: query
        required: false
        description: معرّف نقطة لقاء نشطة. يرجع الإعلانات المرتبطة بها فقط (FR10، DEC28).
        schema:
          $ref: '../components/schemas.yaml#/Uuid'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '../components/schemas.yaml#/ListingSort'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ListingCardPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
  post:
    operationId: api034PublishListing
    tags: [listings]
    summary: نشر إعلان من المعالج
    description: >-
      الخادم يعيد التحقق من كل الحقول وملكية الصور وجاهزيتها. المحاولة المنطقية المكررة بنفس
      Idempotency-Key ترجع نفس الإعلان بالحالة 200 ولا تُعدّ في الحد (FR22)، وبحمولة مختلفة
      IDEMPOTENCY_CONFLICT. والمحاولة التي فشلت لا تحجز المفتاح. بلا Idempotency-Key: 400.
      أخطاء الحقول ترجع في field_errors ليعود المعالج لخطوتها (القسم 6.3):
      title وdescription: required وtoo_small وtoo_big وinvalid_format (بنقاط الترميز بعد NFC والقص).
      category_id وlocation_id: invalid_format، وunavailable لمرجع معطّل أو غير موجود.
      condition: invalid_value. price_minor: too_small وtoo_big. is_negotiable: not_allowed مع السعر صفر (BR08).
      media_ids: too_small وtoo_big وduplicate، وmedia_ids.<n> (من الصفر) مع MEDIA_INVALID
      (صورة غير موجودة أو لعضو آخر أو بغرض آخر أو مرتبطة أو مرفوضة أو منتهية) أو MEDIA_NOT_READY.
      RL05: 5 في الساعة و20 في اليوم مع طلبات الشراء (429)، و200 إعلان نشط (LIMIT_REACHED).
      الرد OwnerListing، وimage فيه null حتى تُنسخ المقاسات العامة بعد النشر (SEC08).
    x-spec-ids: [API034, FR16, FR17, FR18, FR19, FR20, FR21, FR22, BR05, BR06, BR07, BR08, DEC28, TC07, TC08, TC09, TC25, TC64, TC65]
    x-access: member
    x-rate-limit: [RL05]
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ListingInput'
    responses:
      '201':
        $ref: '../components/responses.yaml#/OwnerListingOk'
      '200':
        $ref: '../components/responses.yaml#/OwnerListingOk'
      '202':
        $ref: '../components/responses.yaml#/Processing'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

listing:
  get:
    operationId: api032GetListing
    tags: [listings]
    summary: تفاصيل إعلان
    description: >-
      الإعلان المخفي أو المؤرشف أو المحذوف، أو إعلان حساب مقيّد أو بانتظار الحذف، يرجع نفس 404
      العامة. المباع يظهر بحالته مع تعطيل التفاوض (UC04، DEC84). images فيها الصور التي نُسخت
      مقاساتها العامة فقط، وprimary_image فارغة قبل ذلك («الصور قيد التجهيز»). capabilities بأول سبب
      ينطبق: sign_in_required للزائر، ثم own_content لصاحب الإعلان، ثم account_restricted، ثم
      context_closed للمباع، ثم للعرض وحده free_item وnot_negotiable. وفي البائع: avatar فارغة حتى 4.7،
      وstudent_badge خطأ حتى 7.6، وrating بالعدد صفر حتى 6.2.
    x-spec-ids: [API032, FR13, DEC84, TC05, TC31]
    x-access: public
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ListingDetailOk'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  patch:
    operationId: api035UpdateListing
    tags: [listings]
    summary: تعديل إعلان نشط ظاهر
    description: >-
      لصاحب الإعلان فقط. تغيير السعر يلغي العروض المعلّقة بالسبب price_changed، وجعله مجانياً
      أو غير قابل للتفاوض يلغيها بالسبب made_free_or_fixed (BR41، الفصل 06).
    x-spec-ids: [API035, FR23, BR27, BR41, TC10, TC35]
    x-access: resource_owner
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ListingPatch'
    responses:
      '200':
        $ref: '../components/responses.yaml#/OwnerListingOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'

