# الحساب والملف الشخصي والسياسات.

me:
  get:
    operationId: api015GetMe
    tags: [account]
    summary: بيانات الحساب الخاصة
    description: >-
      متاح لأي جلسة صالحة حتى يعرض الحساب غير المؤكد أو المقيّد حالته.
      الصلاحيات الفعلية في capabilities (DEC58). جلسة الاستعادة المحدودة 403 RECOVERY_SESSION_ONLY
      (DEC73). في المرحلة الأولى قبل جداولها: avatar حتى 4.7، وstudent_badge بقيمتين فارغتين حتى 7.6،
      كلها null.
    x-spec-ids: [API015, FR49, FR04, DEC58, DEC73, DEC77]
    x-access: session
    responses:
      '200':
        $ref: '../components/responses.yaml#/MeOk'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

profileMe:
  patch:
    operationId: api016UpdateProfile
    tags: [account]
    summary: تعديل الملف الشخصي
    description: >-
      الحقول المسموحة فقط، وأي حقل آخر (الدور أو الشارة أو التقييم أو النسخة) يُرفض 400 بلا تغيير (TC21، TC65).
      الصورة الشخصية يجب أن تكون بغرض avatar وجاهزة ويملكها العضو (TC75). حتى المهمة 4.7 لا توجد صورة
      مؤهلة: avatar_id بمعرّف يرجع 422 بالرمز unknown، وnull يُقبل. الكلية فعّالة، أو الحالية إن لم تتغير
      (رمز unknown). expected_version قديم 409 STATE_CONFLICT. طلب لا يغيّر شيئاً يرجع 200 بلا زيادة النسخة.
      حد DEC78: 10 تعديلات ناجحة في الساعة لكل عضو.
    x-spec-ids: [API016, FR49, FR61, DEC30, DEC51, DEC54, DEC78, TC21, TC65, TC75]
    x-access: member
    x-rate-limit: [DEC78]
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ProfilePatch'
    responses:
      '200':
        $ref: '../components/responses.yaml#/MeOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

profilePublic:
  get:
    operationId: api017GetPublicProfile
    tags: [account]
    summary: الملف العام
    description: شهر الانضمام والشارة وإحصاءات التقييم الظاهرة، بلا بريد (FR14).
    x-spec-ids: [API017, FR14, TC05, TC80]
    x-access: public
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
    responses:
      '200':
        $ref: '../components/responses.yaml#/PublicProfileOk'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

profileListings:
  get:
    operationId: api018ListProfileListings
    tags: [account]
    summary: إعلانات العضو العامة
    x-spec-ids: [API018, FR14, TC80]
    x-access: public
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [active, sold]
          default: active
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ListingCardPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

profileReviews:
  get:
    operationId: api019ListProfileReviews
    tags: [account, reviews]
    summary: التقييمات الظاهرة للعضو
    description: العدد والمتوسط مشتقان من التقييمات الظاهرة فقط (FR14، TC80).
    x-spec-ids: [API019, FR14, FR47, TC80]
    x-access: public
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ReviewPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

emailChange:
  post:
    operationId: api020RequestEmailChange
    tags: [account]
    summary: طلب تغيير بريد الدخول
    description: >-
      يرسل رابطاً لكل من العنوانين، صالحاً ساعة (DEC37). البريد القديم يبقى حتى يتأكد الاثنان (BR23،
      DEC79). حدود RL03 تُعدّ للعنوانين الجديد والحالي قبل الاستدعاء. رموز الحقل new_email: صيغة البريد
      كما في التسجيل، وsame_email لنفس البريد الحالي، وtaken لبريد حساب آخر (UC20، كشف مقبول خلف إعادة
      التحقق كما في DEC64). طلب جديد بعد دقيقة يبطل الرابطين السابقين. بعد أكثر من خمس دقائق من آخر
      تحقق بكلمة المرور 403 REAUTH_REQUIRED.
    x-spec-ids: [API020, FR59, BR23, DEC37, DEC38, DEC79, TC74]
    x-access: member_reauth
    x-rate-limit: [RL03, supabase_auth]
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/EmailChangeInput'
    responses:
      '202':
        $ref: '../components/responses.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

emailChangeConfirm:
  post:
    operationId: api021ConfirmEmailChange
    tags: [account]
    summary: تأكيد أحد رابطي تغيير البريد
    description: >-
      كل رابط يسجل تأكيد عنوانه فقط، ولا يقرأ جلسة المتصفح. الاستبدال وإلغاء كل الجلسات وإشعار الأمان
      للعنوان القديم بعد التأكيدين (TC74). القاعدة تفرض التأكيدين (DEC79): رابط واحد لا يكمل التغيير ولو
      أُرسل إلى Supabase Auth مباشرة. 303 إلى /auth/email-change/done?state=waiting بعد الأول، و?state=changed
      بعد الثاني، مع حذف كوكيز جلسة المتصفح إن كانت لنفس العضو. الرابط المستعمل أو المنتهي (ساعة) أو الذي
      أبطله طلب أحدث 422 LINK_INVALID_OR_EXPIRED.
    x-spec-ids: [API021, FR59, BR23, DEC37, DEC79, TC74]
    x-access: guest
    x-rate-limit: [supabase_auth]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TokenInput'
    responses:
      '303':
        $ref: '../components/responses.yaml#/LinkRedirect'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

passwordChange:
  post:
    operationId: api022ChangePassword
    tags: [account]
    summary: تغيير كلمة المرور
    description: >-
      يتحقق من الكلمة الحالية بدخول جديد مع Turnstile، وهذا هو إعادة التحقق في نفس الطلب (DEC38). ثم
      يغيّر الكلمة على الجلسة الجديدة، فتُلغى كل الجلسات الأخرى ومنها جلسة المتصفح القديمة، ويبقى العضو
      داخلاً بالجديدة، فيتجدد رمز CSRF، ويصل بريد الأمان (TC27، SEC11). الكلمة الحالية الخاطئة 422
      بالحقل current_password والرمز wrong، وتُعدّ في RL01 مع الدخول. رموز الحقل new_password كما في
      API008، ومنها same_password.
    x-spec-ids: [API022, FR59, DEC32, DEC38, TC27]
    x-access: member
    x-rate-limit: [RL01, supabase_auth, turnstile]
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PasswordChangeInput'
    responses:
      '204':
        $ref: '../components/responses.yaml#/NoContent'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

deletion:
  post:
    operationId: api026RequestDeletion
    tags: [account]
    summary: طلب حذف الحساب مع مهلة استرجاع 30 يوماً
    description: >-
      يبدأ مهلة 30 يوماً، ويخفي محتوى العضو من الصفحات العامة بلا تغيير حالته (FR72، DEC41)، ويلغي
      صفقاته وعروضه ولقاءاته المعلّقة بالسبب account_restricted (DEC39)، ويسجّل
      account.deletion_requested في التدقيق وإشعاراً للعضو. بعد الحفظ تُلغى كل جلسات العضو (SEC01)،
      والجلسات التي يبقيها خطأ عند Supabase Auth لا ترى إلا DELETION_PENDING. الرد 202 يحذف كوكيز
      جلسة المتصفح ويجدد ربط الزائر، فتطلب الواجهة رمز CSRF جديداً. لا يحتاج الإقرار بالنسخة الحالية
      من الشروط (DEC81). رموز 403: REAUTH_REQUIRED بعد خمس دقائق من آخر تحقق بكلمة المرور،
      وDELETION_PENDING لحساب بانتظار الحذف، وACCOUNT_RESTRICTED لحساب موقوف أو محظور يطلب حذف
      بياناته عبر بريد التواصل ويُعالَج طلبه يدوياً (DEC81). acknowledge غير true 400.
    x-spec-ids: [API026, FR72, BR40, DEC38, DEC39, DEC41, DEC81, SEC01, TC59]
    x-access: account_reauth
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/DeletionInput'
    responses:
      '202':
        $ref: '../components/responses.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

deletionRecoveryRequest:
  post:
    operationId: api027RequestDeletionRecovery
    tags: [account]
    summary: طلب رابط استرجاع حساب بانتظار الحذف
    description: >-
      رد عام بلا كشف للحساب. يُرسل رابط استرجاع صالحاً ساعة ولمرة واحدة (DEC37، DEC41)، لحساب
      بانتظار الحذف ومهلته قائمة فقط. البريد غير المسجّل، والحساب غير المطلوب حذفه، والمهلة المنتهية،
      ومهلة Supabase لحساب موجود، كلها تصل كالرد العام 202 بلا رسالة. الجلسة لا تُقرأ. الدخول خلال
      المهلة يفتح شاشة الاسترجاع فقط، ومنها يُطلب الرابط ببريد الجلسة. حدود RL03 لكل بريد تُعدّ قبل أي
      شيء، وهي نفس عدّادات API005 وAPI006 وAPI020. رابط Supabase هذا ورابط استعادة كلمة المرور في
      خانة واحدة، فطلب أحدهما يبطل الآخر. البريد بصيغة خاطئة 422 للحقل email برمز required أو too_big
      أو invalid_format.
    x-spec-ids: [API027, FR72, DEC37, DEC41, DEC52, RL03, TC59]
    x-access: guest
    x-rate-limit: [RL03, supabase_auth, turnstile]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/EmailCaptchaInput'
    responses:
      '202':
        $ref: '../components/responses.yaml#/Accepted'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

deletionRecoveryConfirm:
  post:
    operationId: api028ConfirmDeletionRecovery
    tags: [account]
    summary: استرجاع الحساب خلال المهلة
    description: >-
      صفحة الرابط بطلب GET تعرض زراً فقط، وهذا الطلب POST هو الذي يستهلك الرابط مرة واحدة. الخادم
      يتحقق منه بجلسة لا تغادره، ثم يسترجع الحساب بها، ثم ينهيها، فلا كوكي جلسة في الرد، وجلسة المتصفح
      لا تُقرأ. يبقى الإيقاف أو الحظر الإداري كما هو بعد الاسترجاع، وما ألغاه طلب الحذف لا يعود (FR72،
      DEC39، DEC41، TC59). يُسجَّل account.deletion_recovered في التدقيق. النجاح 303 إلى
      /auth/account-recovery/done. الرابط المستعمل أو المنتهي (ساعة) أو الأقدم من رابط أحدث، أو رابط
      لحساب ليس بانتظار الحذف، 422 LINK_INVALID_OR_EXPIRED. وبعد 30 يوماً كاملة من طلب الحذف 422
      DEADLINE_PASSED.
    x-spec-ids: [API028, FR72, DEC37, DEC39, DEC41, DEC73, TC59]
    x-access: guest
    x-rate-limit: [supabase_auth]
    security:
      - csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TokenInput'
    responses:
      '303':
        $ref: '../components/responses.yaml#/LinkRedirect'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

preferences:
