offersCreate:
  post:
    operationId: api057SendOffer
    tags: [offers]
    summary: إرسال عرض سعر
    description: >-
      للمشتري في سياق نشط بسعر موجب قابل للتفاوض أو ميزانية طلب موجبة (FR33). عرض معلّق واحد
      لكل محادثة كقيد في القاعدة (BR33)، وينتهي بعد 72 ساعة.
    x-spec-ids: [API057, FR33, FR34, FR42, BR09, BR30, BR33, DEC15, TC14, TC43, TC73]
    x-access: participant
    x-rate-limit: [RL08]
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/OfferInput'
    responses:
      '201':
        $ref: '../components/responses.yaml#/OfferOk'
      '200':
        $ref: '../components/responses.yaml#/OfferOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

offer:
  patch:
    operationId: api058DecideOffer
    tags: [offers]
    summary: قبول عرض أو رفضه أو سحبه
    description: >-
      البائع المستلم وحده يقبل أو يرفض، والمرسل يسحب قبل القرار. القبول اتفاق مبدئي ولا يحجز الغرض
      (FR36). التعارض أو الانتهاء يرجع 409 (TC15، TC44).
    x-spec-ids: [API058, FR35, FR36, FR65, BR12, BR13, TC15, TC44, TC45]
    x-access: participant
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/OfferAction'
    responses:
      '200':
        $ref: '../components/responses.yaml#/OfferOk'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'

