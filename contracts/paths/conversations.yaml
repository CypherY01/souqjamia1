meetupsCreate:
  post:
    operationId: api059ProposeMeetup
    tags: [meetups]
    summary: اقتراح لقاء
    description: >-
      نقطة لقاء مقترحة أو نص حر قصير (DEC28). الموعد بعد 30 دقيقة إلى 30 يوماً، يُخزَّن UTC
      ويُعرض بتوقيت الرياض (BR14). إعادة الجدولة اقتراح جديد مرتبط بالسابق (BR34).
      أربعة لقاءات مستقبلية غير ملغاة كحد أقصى لكل محادثة (RL08).
    x-spec-ids: [API059, FR37, FR38, FR42, BR10, BR14, BR34, DEC15, DEC28, DEC44, TC16, TC46]
    x-access: participant
    x-rate-limit: [RL08]
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MeetupInput'
    responses:
      '201':
        $ref: '../components/responses.yaml#/MeetupOk'
      '200':
        $ref: '../components/responses.yaml#/MeetupOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
