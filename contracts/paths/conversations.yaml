# المحادثات والرسائل والعروض واللقاءات والحظر.
# الكتابة تتبع ترتيب الأقفال في الفصل 07، والأحداث الفورية تُنشر بعد نجاح المعاملة فقط (contracts/realtime.md).

conversations:
  get:
    operationId: api052ListConversations
    tags: [conversations]
    summary: صندوق المحادثات
    description: عدد المحادثات منفصل عن عدد الرسائل الواردة غير المقروءة (FR30).
    x-spec-ids: [API052, FR30, BR31, TC39]
    x-access: member
    parameters:
      - $ref: '../components/parameters.yaml#/Query'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ConversationPage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
  post:
    operationId: api051StartConversation
    tags: [conversations]
    summary: بدء محادثة على إعلان أو طلب، أو استرجاع الموجودة
    description: >-
      محادثة واحدة لكل سياق وزوج مشترٍ وبائع، ولو تكررت المحاولة (FR29، BR29). الأدوار يحددها الخادم.
      في الإعلان المشتري هو المتصل، وفي الطلب المشتري هو صاحب الطلب. لا يراسل العضو نفسه.
      استرجاع محادثة موجودة لا يُحسب في RL06.
    x-spec-ids: [API051, FR29, FR62, BR29, BR30, DEC10, TC12]
    x-access: member
    x-rate-limit: [RL06]
    security:
      - sessionCookie: []
        csrfToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ConversationCreateInput'
    responses:
      '201':
        $ref: '../components/responses.yaml#/ConversationOk'
      '200':
        $ref: '../components/responses.yaml#/ConversationOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

conversation:
  get:
    operationId: api053GetConversation
    tags: [conversations]
    summary: المحادثة وسياقها وإمكانيات الواجهة
    description: السياق لا يتغير بعد الإنشاء، وتُعرض حالته الحالية (FR28، DEC11).
    x-spec-ids: [API053, FR28, FR32, FR42, TC12]
    x-access: participant
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
    responses:
      '200':
        $ref: '../components/responses.yaml#/ConversationOk'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

messages:
  get:
    operationId: api054ListMessages
    tags: [conversations]
    summary: الرسائل مرتبة بالتسلسل
    description: >-
      after_seq أو before_seq وليس الاثنان. هذا أيضاً مسار استرجاع الفجوات بعد انقطاع Realtime (FR40).
    x-spec-ids: [API054, FR31, FR40, FR64, TC12, TC39, TC42]
    x-access: participant
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - name: after_seq
        in: query
        required: false
        schema:
          $ref: '../components/schemas.yaml#/Seq'
      - name: before_seq
        in: query
        required: false
        schema:
          $ref: '../components/schemas.yaml#/Seq'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        $ref: '../components/responses.yaml#/MessagePage'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  post:
    operationId: api055SendMessage
    tags: [conversations]
    summary: إرسال رسالة نصية أو بصور
    description: >-
      تُحفظ الرسالة والتسلسل والحدث في معاملة واحدة. نفس client_message_id يرجع نفس الرسالة
      بلا تكرار (TC13، TC40). الحظر في أي اتجاه يمنع الرسائل الجديدة (BR30).
    x-spec-ids: [API055, FR31, FR41, FR69, BR30, DEC14, DEC21, TC12, TC13, TC40]
    x-access: participant
    x-rate-limit: [RL07]
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MessageInput'
    responses:
      '201':
        $ref: '../components/responses.yaml#/MessageSavedOk'
      '200':
        $ref: '../components/responses.yaml#/MessageSavedOk'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

read:
  post:
    operationId: api056MarkRead
    tags: [conversations]
    summary: تحديث مؤشر القراءة
    description: >-
      يُحفظ الأكبر بين المؤشر السابق والجديد، ولا يتجاوز آخر رسالة ملتزمة (FR64، BR31).
    x-spec-ids: [API056, FR64, BR31, DEC13, TC39]
