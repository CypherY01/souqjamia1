meetup:
  patch:
    operationId: api060RespondToMeetup
    tags: [meetups]
    summary: قبول اقتراح لقاء أو رفضه أو إلغاؤه
    description: >-
      المستلم يقبل أو يرفض قبل الموعد. أي طرف يلغي المقترح أو المقبول، والإلغاء في الساعة الأخيرة
      أو بعدها يُعلَّم متأخراً (BR34، TC47). الإلغاء مسموح حتى مع الحظر. سبب الإلغاء
      by_proposer أو by_recipient يحدده الخادم من المتصل (DEC39).
    x-spec-ids: [API060, FR39, FR65, BR34, DEC39, TC16, TC47]
    x-access: participant
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/Id'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MeetupAction'
    responses:
