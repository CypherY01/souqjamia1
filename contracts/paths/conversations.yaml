block:
  put:
    operationId: api062BlockUser
    tags: [blocks]
    summary: حظر عضو تعرفه من سياق مسموح
    description: >-
      يمنع التواصل الجديد في الاتجاهين، ويلغي العروض المعلّقة واللقاءات المستقبلية بسبب مسجّل،
      تحت أقفال الزوج المرتبة (BR30، FR79). لا يُشعَر المحظور. لا يلغي الصفقة المعلّقة، ويبقى
      تأكيدها مسموحاً (DEC12، DEC39).
    x-spec-ids: [API062, FR44, FR79, BR16, BR30, DEC12, DEC39, TC17, TC45, TC49]
    x-access: member
    security:
      - sessionCookie: []
        csrfToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/UserId'
    responses:
      '204':
        $ref: '../components/responses.yaml#/NoContent'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/Unprocessable'
  delete:
    operationId: api063UnblockUser
    tags: [blocks]
    summary: رفع حظري فقط
    description: لا يرفع حظر الطرف الآخر ولا يعيد ما أُلغي ولا يرفع قيداً إدارياً (FR63، TC49).
