# ردود مشتركة. كل رد ناجح بصيغة {data, meta?} وكل خطأ بغلاف Error (الفصل 09).

# ---------- أخطاء ----------

BadRequest:
  description: بنية طلب غير صالحة أو مؤشر صفحة مزوّر أو حمولة أكبر من 128 KiB (NFR10).
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

Unauthorized:
  description: لا توجد جلسة صالحة، أو بيانات الدخول غير صحيحة برسالة عامة.
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

Forbidden:
  description: >-
    إجراء غير مسموح. يشمل CSRF أو Origin غير صالح (SEC05)، والبريد غير المؤكد،
    وعدم الإقرار بالشروط (DEC36)، والحساب المقيّد، ونقص MFA أو إعادة التحقق (DEC38).
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

NotFound:
  description: المورد غير متاح. نفس الرد سواء لم يوجد أو كان خاصاً، بلا كشف لوجوده.
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

Conflict:
  description: تعارض في الحالة أو النسخة (STATE_CONFLICT) أو في حمولة مفتاح منع التكرار (IDEMPOTENCY_CONFLICT).
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

Unprocessable:
  description: مدخلات سليمة البنية تخالف قاعدة عمل، مع field_errors عند الحاجة.
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

TooManyRequests:
  description: تجاوز حد الطلبات (SEC07).
  headers:
    Retry-After:
      $ref: 'headers.yaml#/RetryAfter'
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

ServiceUnavailable:
  description: تعطل مؤقت قابل لإعادة المحاولة، أو عداد حد الكتابة غير متاح (SEC07).
  headers:
    Retry-After:
      $ref: 'headers.yaml#/RetryAfter'
  content:
    application/json:
      schema:
        $ref: 'schemas.yaml#/Error'

# ---------- ردود عامة ----------

NoContent:
  description: تم بلا محتوى.

Accepted:
  description: تم القبول. الرد عام ولا يكشف وجود حساب أو بريد.
  content:
    application/json:
      schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [status]
            properties:
              status:
                const: accepted

Processing:
  description: الطلب نفسه بنفس مفتاح منع التكرار ما زال قيد المعالجة. أعد المحاولة بعد Retry-After.
  headers:
    Retry-After:
      $ref: 'headers.yaml#/RetryAfter'
  content:
    application/json:
      schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [status]
            properties:
              status:
                const: processing

LinkRedirect:
  description: استُهلك الرابط مرة واحدة، والتوجيه لمسار محلي (الفصل 09). لا تُنشأ جلسة سوق تلقائياً.
  headers:
    Location:
      $ref: 'headers.yaml#/Location'

# ---------- الهوية والحساب ----------

