packages:
  - apps/*
  - packages/*
  - scripts
  - tests

# Version policy (plan/task-1.2.md): exact versions only, newest stable release
# that is at least 14 days old. A security release may skip the wait: add it to
# minimumReleaseAgeExclude as "name@version" with a comment giving the reason.
catalog:
  "@axe-core/playwright": 4.14.0
  "@eslint/js": 9.39.5
  "@playwright/test": 1.64.1
  "@redocly/cli": 2.73.0
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.119.0
  "@types/node": 26.6.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  eslint: 9.39.5
  eslint-config-next: 16.4.5
  next: 16.4.5
  pg: 8.23.1
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  smol-toml: 1.9.1
  supabase: 3.0.0
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vitest: 5.1.0
  zod: 4.6.7

# 14 days, in minutes. Applies to indirect dependencies too.
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude: []

# Dependency install scripts are blocked unless reviewed and listed here.
strictDepBuilds: true
allowBuilds: {}

engineStrict: true
saveExact: true
