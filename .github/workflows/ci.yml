# CI for سوق الجامعة (task 1.3: OPS05, SEC06, NFR17).
# Actions are pinned by commit SHA and Docker images by digest; the comment gives the version.
# Versions follow the policy in plan/task-1.2.md (stable releases at least 14 days old).
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, tests, contract, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflow files (actionlint 1.7.12)
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Logical CSS properties only (RTL)
        run: pnpm check:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Contract lint
        run: pnpm contract:lint

      - name: Contract ID coverage
        run: pnpm check:contract-ids

      # Task 2.1: merged migrations are never edited or deleted, new ones sort after them.
      - name: Migrations are forward-only
        run: |
          git fetch --no-tags --depth=1 origin main
          pnpm check:migrations

      - name: Build
        run: pnpm build
        env:
          # The build requires the public Supabase values (OPS05, apps/web/next.config.ts).
          # CI only checks that the bundle builds, so these are public placeholders, not keys.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: No secrets in browser-facing build output (SEC06)
        run: pnpm check:bundle

  e2e:
    name: E2E (Playwright, Chromium at 360, 768 and 1440 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Public placeholders, not keys (see the checks job).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      # The browser is cached between runs, keyed by the Playwright version, so a version bump
      # downloads it once again. There is no `playwright install-deps` (apt) step: it took up to
      # 455 s in some runs, and the ubuntu-24.04 image already has Google Chrome's system
      # libraries. If Chromium ever fails to start for a missing library, add that step back.
      - name: Playwright version (browser cache key)
        id: playwright
        run: echo "version=$(pnpm --filter @souq/tests exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore or save the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Download Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @souq/tests exec playwright install --only-shell chromium

      - name: E2E tests
        run: pnpm test:e2e

  integration:
    name: Integration (local Supabase, database and RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turn off Supabase CLI telemetry
        run: pnpm --filter @souq/db exec supabase telemetry disable

      # The Supabase CLI pinned in packages/db applies the migrations on start. Only the
      # services the tests use run: Postgres, Auth, PostgREST, Kong and Mailpit. Realtime and
      # Storage join when tasks 4.1 and 5.4 need them.
      - name: Start local Supabase
        run: pnpm --filter @souq/db exec supabase start -x studio,postgres-meta,realtime,storage-api,imgproxy

      # The CLI pulls by tag; the digests are pinned in packages/db/supabase/images.lock.json.
      - name: Supabase images match their pinned digests
        run: pnpm check:supabase-images

      - name: PL/pgSQL lint (plpgsql_check)
        run: pnpm db:lint

      - name: Integration tests
        run: pnpm test:integration

      - name: Supabase container logs (on failure)
        if: failure()
        run: |
          for container in $(docker ps -a --filter label=com.supabase.cli.project=souqjamia1 --format '{{.Names}}'); do
            echo "::group::${container}"
            docker logs --tail 80 "${container}" 2>&1
            echo "::endgroup::"
          done

  secrets:
    name: Secret scan of git history (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: gitleaks (image pinned in scripts/secrets-scan.ts)
        run: node scripts/secrets-scan.ts
